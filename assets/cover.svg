    <linearGradient id="grass" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#e8d0f6"/><stop offset=".48" stop-color="#b89ce8"/><stop offset="1" stop-color="#967ec4"/></linearGradient>
    <linearGradient id="petal" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#ffe5f2"/><stop offset=".45" stop-color="#f7bedb"/><stop offset="1" stop-color="#ce70ad"/></linearGradient>
