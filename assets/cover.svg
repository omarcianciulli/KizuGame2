<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="650" viewBox="0 0 680 650" role="img" aria-labelledby="title desc">
  <title id="title">Un piccolo ratto rosa, un universo intero</title>
  <desc id="desc">Un ratto rosa con cuffie e felpa viola su un'isola fluttuante, fra gigli, un torii, una piramide e un pianeta con gli anelli.</desc>
